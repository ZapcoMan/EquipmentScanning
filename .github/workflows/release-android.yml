name: Release Android APK

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Inject signing keystore
        env:
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
        run: |
          if [ -n "$KEYSTORE_BASE64" ]; then
            echo "$KEYSTORE_BASE64" | base64 -d > app/netmap-release.jks
            cat > keystore.properties <<EOF
          storeFile=netmap-release.jks
          storePassword=$KEYSTORE_PASSWORD
          keyAlias=$KEY_ALIAS
          keyPassword=$KEY_PASSWORD
          EOF
            echo "正式签名密钥已注入"
          else
            echo "未配置签名 secrets，回退使用 debug 签名构建 release（可安装但非正式签名）"
            sed -i 's/getByName("release")/getByName("debug")/' app/build.gradle.kts
          fi

      - name: Build release APK
        run: ./gradlew assembleRelease --no-daemon

      - name: Prepare release asset
        id: asset
        run: |
          TAG=${GITHUB_REF#refs/tags/}
          [ "$TAG" = "$GITHUB_REF" ] && TAG="dev"
          mkdir -p out
          cp app/build/outputs/apk/release/*.apk "out/NetMap-${TAG}.apk" 2>/dev/null \
            || cp app/build/outputs/apk/debug/*.apk "out/NetMap-${TAG}.apk"
          echo "tag=$TAG" >> "$GITHUB_OUTPUT"

      - name: Upload to GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          files: out/NetMap-*.apk
          generate_release_notes: true
          body: |
            ## NetMap ${{ steps.asset.outputs.tag }}

            详见 [CHANGELOG.md](https://github.com/${{ github.repository }}/blob/master/CHANGELOG.md)。

            > 若 CI 未配置签名 secrets，本资产为 debug 签名构建，可安装但非正式签名。
